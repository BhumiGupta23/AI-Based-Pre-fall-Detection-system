<!DOCTYPE html>
<html>
<head>
    <title>Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background: linear-gradient(to right,#050816,#0b0f2b);
            font-family: Arial, sans-serif;
            margin:0;
            padding:0;
        }

        .title{
            text-align:center;
            color:white;
            font-size:50px;
            margin-top:30px;
            text-shadow:0 0 20px cyan;
        }

        .back-btn{
            position:absolute;
            top:20px;
            left:20px;
            padding:14px 28px;
            background:linear-gradient(45deg,#df1d08#b20b10,);
            color:white;
            text-decoration:none;
            border-radius:40px;
            font-weight:bold;
            font-size:15px;
            border:none;
            box-shadow:0 0 20px cyan;
            transition:0.3s;
        }

        .back-btn:hover{
            transform:scale(1.08);
            box-shadow:0 0 30px cyan;
        }

        .chart-container{
            width:85%;
            height:600px;
            margin:auto;
            margin-top:50px;
            background:rgba(255,255,255,0.06);
            border-radius:25px;
            padding:30px;
            box-shadow:0 0 30px cyan;
            border:2px solid rgba(0,255,255,0.3);
        }

        canvas{
            width:100% !important;
            height:100% !important;
        }

    </style>
</head>

<body>

<a href="/" class="back-btn">⬅️ Back Dashboard</a>

<h1 class="title">📊 FALL ANALYTICS</h1>

<div class="chart-container">
    <canvas id="myChart"></canvas>
</div>

<script>

let fallCount = 0;
let normalCount = 0;

{% for row in data %}
    {% if row[3] == 'Fall' %}
        fallCount++;
    {% else %}
        normalCount++;
    {% endif %}
{% endfor %}

new Chart(document.getElementById('myChart'), {

    type:'bar',

    data:{
        labels:['Fall','Normal'],

        datasets:[{
            label:'Fall Report',

            data:[fallCount, normalCount],

            backgroundColor:[
                'rgba(255, 80, 80, 0.8)',
                'rgba(0, 255, 200, 0.8)'
            ],

            borderColor:[
                '#ff0000',
                '#00fff2'
            ],

            borderWidth:3,
            borderRadius:10
        }]
    },

    options:{
        responsive:true,
        maintainAspectRatio:false,

        plugins:{
            legend:{
                labels:{
                    color:"white",
                    font:{
                        size:18,
                        weight:'bold'
                    }
                }
            }
        },

        scales:{
            x:{
                ticks:{
                    color:"white",
                    font:{
                        size:16,
                        weight:'bold'
                    }
                },

                grid:{
                    color:"rgba(255,255,255,0.1)"
                }
            },

            y:{
                ticks:{
                    color:"white",
                    font:{
                        size:16,
                        weight:'bold'
                    }
                },

                grid:{
                    color:"rgba(255,255,255,0.15)"
                }
            }
        }
    }
});

</script>

</body>
</html>
